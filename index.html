<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d111a">
<title>Mission Gesetz</title>
<style>
:root{
  --bg:#0d111a; --panel:#2b313d; --panel2:#3a4150; --edge:#0b0d12; --text:#f3f5f8; --muted:#a9b2c2;
  --yellow:#ffd84a; --green:#3ddc6f; --red:#e5484d; --cyan:#5fd7ff; --paper:#f6f0dd;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}
#taskbox{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));width:min(330px,62vw)}
#totalbar{background:#1b1f27;border:3px solid var(--edge);border-radius:6px;height:26px;position:relative;overflow:hidden}
#totalfill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#5cf08a,#2bb557);width:0;transition:width .5s}
#totalbar span{position:absolute;inset:0;display:flex;align-items:center;padding-left:8px;font-weight:800;font-size:12px;letter-spacing:.08em;
  text-shadow:0 0 3px #000,0 0 3px #000}
#tasklist{margin-top:6px;background:rgba(220,224,232,.18);backdrop-filter:blur(2px);border-radius:6px;padding:8px 10px;font-size:13.5px;line-height:1.35;
  text-shadow:0 1px 2px #000,0 0 2px #000;max-height:46vh;overflow:auto}
#tasklist .hd{display:flex;justify-content:space-between;font-weight:800;margin-bottom:3px;cursor:pointer}
#tasklist .t{padding:1px 0}
#tasklist .t.part{color:var(--yellow)}
#tasklist .t.done{color:var(--green)}
#tasklist .t.lock{color:#8c94a3}
#tasklist.min .t{display:none}
.hudbtn{position:absolute;width:58px;height:58px;border-radius:12px;background:rgba(30,34,44,.85);border:3px solid var(--edge);
  display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:24px;line-height:1}
.hudbtn small{font-size:9.5px;font-weight:800;letter-spacing:.05em;margin-top:3px}
#btnMap{right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top))}
#btnPause{right:calc(max(10px,env(safe-area-inset-right)) + 66px);top:max(10px,env(safe-area-inset-top))}
#btnUse{right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));width:96px;height:96px;border-radius:18px;
  font-size:38px;opacity:.35;transition:opacity .15s,transform .1s;background:rgba(30,34,44,.9)}
#btnUse.on{opacity:1;border-color:var(--yellow);box-shadow:0 0 18px rgba(255,216,74,.5)}
#btnUse.on:active{transform:scale(.94)}
#btnUse small{font-size:11px}
#roomlbl{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);font-weight:800;font-size:15px;
  text-shadow:0 0 4px #000,0 0 3px #000;pointer-events:none;letter-spacing:.03em;white-space:nowrap}
#hint{position:absolute;left:50%;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 26px);transform:translateX(-50%);font-size:12.5px;color:var(--muted);
  text-shadow:0 0 3px #000;pointer-events:none;white-space:nowrap}
#toast{position:absolute;left:50%;top:max(80px,calc(env(safe-area-inset-top) + 72px));transform:translateX(-50%);background:rgba(20,24,32,.92);border:3px solid var(--edge);
  border-radius:10px;padding:9px 16px;font-weight:700;font-size:15px;max-width:min(560px,90vw);text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
#joy{position:fixed;width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);pointer-events:none;display:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.45)}

/* ---------- Overlays ---------- */
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(5,7,12,.62);z-index:20}
.mg{width:min(600px,100%);max-height:100%;overflow:auto;background:linear-gradient(#444c5c,#2c323d);border:6px solid var(--edge);border-radius:16px;
  box-shadow:0 10px 40px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.12);padding:16px 16px 18px;position:relative}
.mg h2{margin:0 44px 10px;text-align:center;font-size:19px;letter-spacing:.02em}
.mg .x{position:absolute;left:10px;top:10px;width:36px;height:36px;border-radius:8px;background:var(--red);border:3px solid var(--edge);font-weight:900;font-size:18px;line-height:1}
.mg .sub{color:#d5dae3;text-align:center;font-size:14.5px;margin:-4px 0 12px;line-height:1.4}
.screen{background:#1a1e27;border:4px solid var(--edge);border-radius:10px;padding:12px;box-shadow:inset 0 0 18px rgba(0,0,0,.5)}
.btn{background:#5a6478;border:3px solid var(--edge);border-radius:10px;padding:10px 14px;font-weight:800;font-size:15px;min-height:46px;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.btn.go{background:#2fa956}.btn.blue{background:#2f6fd6}.btn.warn{background:#c84a3a}
.btn.ok{background:var(--green)!important;color:#08210f}.btn.bad{background:var(--red)!important;animation:shake .35s}
.btn:disabled{opacity:.45}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{margin-top:10px;padding:10px 12px;border-radius:8px;font-size:14.5px;line-height:1.45;background:#20252f;border-left:5px solid var(--muted)}
.feedback.good{border-color:var(--green)}.feedback.bad{border-color:var(--red)}
.answers{display:grid;gap:8px}
.answers .btn{text-align:left;font-weight:700}
.center{text-align:center}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}

/* dialog */
.dlg{display:flex;gap:14px;align-items:flex-start}
.dlg canvas{flex:none;width:92px;height:110px;background:radial-gradient(#5a6680,#2a3040);border:4px solid var(--edge);border-radius:10px}
.dlg .who{font-weight:900;font-size:17px}
.dlg .role{color:var(--yellow);font-size:13px;font-weight:700;margin-bottom:6px}
.dlg .txt{font-size:15.5px;line-height:1.5}

/* sign */
.paper{background:var(--paper);color:#2a2a2a;border-radius:4px;padding:16px 18px;box-shadow:0 4px 0 #b9ad8c;position:relative;font-family:Georgia,serif}
.paper h3{margin:0 0 8px;font-size:16px}
.paper .ln{height:7px;background:#d8cfb6;border-radius:3px;margin:7px 0}
.paper .sigrow{display:flex;align-items:flex-end;gap:8px;margin-top:16px;font-size:13px}
.paper svg{width:200px;height:56px;border-bottom:2px solid #333}
.paper .stampmark{position:absolute;right:16px;top:14px;border:3px solid #c0392b;color:#c0392b;font-weight:900;padding:3px 8px;transform:rotate(-12deg);
  font-family:"Trebuchet MS",sans-serif;opacity:0;transition:opacity .2s}

/* swipe */
.reader{height:80px;border-radius:10px;background:linear-gradient(#22272f,#14171c);border:4px solid var(--edge);position:relative;margin:20px 0 10px}
.reader .slot{position:absolute;left:10px;right:10px;top:50%;height:6px;margin-top:-3px;background:#000;border-radius:3px}
.reader .led{position:absolute;right:14px;top:8px;width:14px;height:14px;border-radius:50%;background:#444}
.card{position:absolute;left:8px;top:-34px;width:130px;height:80px;line-height:1.2;border-radius:9px;background:linear-gradient(135deg,#f4f4f4,#cfd8e3);border:3px solid var(--edge);
  color:#223;font-size:10px;padding:6px;font-weight:700;touch-action:none;cursor:grab}
.card .ph{position:absolute;left:7px;bottom:6px;width:26px;height:30px;background:#8aa0bd;border-radius:3px}
.card .lines{position:absolute;left:44px;bottom:10px;right:8px}
.card .lines i{display:block;height:5px;background:#9aa6b8;margin-top:5px;border-radius:2px}
.lcd{font-family:"Courier New",monospace;background:#0f1a10;color:#6cff8b;border:3px solid var(--edge);border-radius:6px;padding:8px 10px;font-weight:700;text-align:center;min-height:40px}

/* sort */
.sortcard{background:var(--paper);color:#222;border-radius:8px;padding:18px;font-size:17px;font-weight:700;text-align:center;min-height:84px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 0 #b9ad8c;transition:transform .2s,opacity .2s}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.dots{display:flex;gap:5px;justify-content:center;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:#555}
.dots i.on{background:var(--green)}

/* order */
.seq{display:grid;gap:6px;margin-bottom:10px}
.seq div{background:#244b33;border:2px solid #3ddc6f;border-radius:8px;padding:8px 10px;font-weight:700;font-size:14.5px}
.seq div b{display:inline-block;width:24px}
.pool{display:grid;gap:7px}

/* wires */
.wires{position:relative;display:grid;grid-template-columns:1fr 70px 1fr;gap:0;align-items:stretch}
.wires svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.wcol{display:grid;gap:10px}
.wit{display:flex;align-items:center;min-height:50px;background:#1f2430;border:3px solid var(--edge);border-radius:8px;padding:6px 8px;font-size:13.5px;font-weight:700;line-height:1.25;touch-action:none}
.wit.l{padding-right:4px}.wit.r{padding-left:4px}
.wit .plug{flex:none;width:18px;height:26px;border-radius:4px;border:2px solid var(--edge)}
.wit.l .plug{margin-left:auto}.wit.r .plug{margin-right:8px;order:-1}
.wit.l span{margin-right:6px}
.wit.sel{outline:3px solid var(--yellow)}
.wit.done{opacity:.75}

/* stamp */
.stampzone{position:relative;height:210px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sheet{position:absolute;width:190px;height:180px;background:var(--paper);border-radius:4px;box-shadow:0 4px 0 #b9ad8c;padding:14px;transition:transform .45s ease-in,opacity .45s}
.sheet h4{margin:0 0 6px;font-size:13px;color:#333;font-family:Georgia,serif}
.sheet .ln{height:6px;background:#d8cfb6;border-radius:3px;margin:7px 0}
.sheet .mk{position:absolute;left:30px;bottom:26px;border:4px solid #c0392b;color:#c0392b;font-weight:900;padding:4px 10px;transform:rotate(-10deg) scale(1.6);opacity:0;transition:all .15s}
.sheet.st .mk{opacity:1;transform:rotate(-10deg) scale(1)}
.stamper{font-size:54px;position:absolute;top:-10px;transition:top .12s;pointer-events:none}

/* transfer */
.xfer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 4px}
.folder{width:96px;text-align:center;font-size:12px;font-weight:700;color:#cfd6e2}
.folder div{font-size:50px;line-height:1}
.flyzone{flex:1;position:relative;height:50px}
.flyzone i{position:absolute;top:12px;font-style:normal;font-size:22px;opacity:0}
.prog{height:26px;background:#10131a;border:3px solid var(--edge);border-radius:6px;overflow:hidden;margin-top:8px}
.prog div{height:100%;width:0;background:linear-gradient(#5cf08a,#2bb557)}

/* count */
.cards{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.vc{width:44px;height:30px;border-radius:5px;border:2px solid var(--edge);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}
.vc.ja{background:#3ba55c}.vc.nein{background:#d9534f}.vc.enth{background:#c9ccd3;color:#222}
.land{min-width:84px;padding:5px 6px;border-radius:6px;border:2px solid var(--edge);font-size:11.5px;font-weight:800;text-align:center;line-height:1.2}
.land b{display:block;font-size:17px}
.keypad{display:grid;grid-template-columns:repeat(3,62px);gap:7px;justify-content:center;margin-top:10px}
.keypad .btn{padding:0;min-height:48px;font-size:20px}

/* vote */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.vt{display:flex;align-items:center;gap:8px;background:#d8dde6;color:#1a1d24;border:3px solid var(--edge);border-radius:8px;padding:4px 8px 4px 4px;position:relative;min-height:56px}
.vt canvas{width:42px;height:50px;flex:none}
.vt .nm{font-weight:800;font-size:13px;line-height:1.15}
.vt .vb{position:absolute;right:6px;top:50%;transform:translateY(-50%) scale(1.8) rotate(-8deg);font-weight:900;font-size:12px;padding:2px 6px;border-radius:4px;border:2px solid;opacity:0;transition:all .18s}
.vt .vb.show{opacity:1;transform:translateY(-50%) scale(1) rotate(-8deg)}
.vb.ja{color:#1d7a3c;border-color:#1d7a3c;background:#c9f2d5}.vb.nein{color:#a32222;border-color:#a32222;background:#f6d0d0}.vb.enth{color:#555;border-color:#555;background:#eee}
.vt.me{background:#fff6cf}
.result{font-size:22px;font-weight:900;text-align:center;margin-top:12px}

/* ---------- Screens ---------- */
.scr{position:fixed;inset:0;z-index:30;overflow:auto;background:radial-gradient(ellipse at 50% 30%,#1a2236 0%,#070910 75%);display:flex;flex-direction:column;align-items:center;
  padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff8,transparent),radial-gradient(1px 1px at 70% 20%,#fff9,transparent),
  radial-gradient(1.5px 1.5px at 40% 70%,#fff6,transparent),radial-gradient(1px 1px at 85% 60%,#fff8,transparent),radial-gradient(1px 1px at 10% 85%,#fff7,transparent),
  radial-gradient(1.2px 1.2px at 55% 45%,#fff5,transparent),radial-gradient(1px 1px at 92% 90%,#fff8,transparent);background-size:340px 340px}
.logo{font-size:clamp(34px,9vw,66px);font-weight:900;letter-spacing:.04em;margin:18px 0 0;text-align:center;line-height:1;
  color:#fff;text-shadow:0 4px 0 #0b0d12,4px 0 0 #0b0d12,-4px 0 0 #0b0d12,0 -4px 0 #0b0d12,0 8px 18px rgba(0,0,0,.6)}
.logo span{color:var(--yellow)}
.tag{color:var(--muted);text-align:center;margin:12px auto 4px;max-width:560px;line-height:1.45;font-size:15px}
.wrap{width:min(720px,100%);position:relative}
.card2{background:rgba(40,46,58,.85);border:4px solid var(--edge);border-radius:14px;padding:14px;margin-top:14px}
.card2 h3{margin:0 0 10px;font-size:16px;letter-spacing:.04em}
.colors{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.colors button{width:38px;height:38px;border-radius:50%;border:3px solid var(--edge)}
.colors button.on{outline:3px solid #fff;outline-offset:2px}
.nameIn{background:#151922;border:3px solid var(--edge);border-radius:8px;color:#fff;padding:8px 10px;font:inherit;font-weight:700;width:170px}
.levels{display:grid;gap:8px}
.lv{display:flex;align-items:center;gap:12px;background:#222834;border:3px solid var(--edge);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.lv .n{flex:none;width:40px;height:40px;border-radius:50%;background:#2f6fd6;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;border:3px solid var(--edge)}
.lv.done .n{background:var(--green);color:#0a2412}
.lv.lock{opacity:.45}
.lv b{display:block;font-size:15.5px}.lv small{color:var(--muted);font-size:13px}
.lv .chk{margin-left:auto;font-size:20px}
.bigtitle{font-size:clamp(36px,10vw,72px);font-weight:900;letter-spacing:.05em;text-align:center;margin:16px 0 4px}
.win{color:var(--cyan);text-shadow:0 0 22px rgba(95,215,255,.6)}
.lvlno{color:var(--yellow);font-weight:900;letter-spacing:.3em;margin-top:22px;font-size:15px}
#crewcv{width:min(520px,100%);height:150px;display:block;margin:8px auto}
.track{display:flex;gap:4px;margin:14px 0 4px;width:100%}
.track div{flex:1;text-align:center;font-size:10.5px;color:var(--muted);font-weight:700}
.track div i{display:block;height:8px;border-radius:4px;background:#3a4150;margin-bottom:5px;border:2px solid var(--edge)}
.track div.d i{background:var(--green)}.track div.c i{background:var(--yellow)}.track div.c{color:#fff}
.recap{margin:0;padding-left:20px;line-height:1.5;font-size:15px}
.recap li{margin:5px 0}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:6px}
a.linkbtn{display:inline-block}
.keys{color:var(--muted);font-size:13px;text-align:center;margin-top:10px;line-height:1.5}

@media (max-width:600px){
  #tasklist{font-size:12px;max-height:34vh;padding:6px 8px}
  #totalbar span{font-size:10.5px}
  .land{min-width:70px;font-size:10px;padding:3px 4px}.land b{font-size:14px}
  .mg{padding:12px 10px 14px}.mg h2{font-size:17px}
  #toast{top:auto;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 120px);font-size:13.5px}
}
/* map */
#mapov canvas{width:min(94vw,900px);height:auto;max-height:82vh;border:5px solid var(--edge);border-radius:14px;background:rgba(36,82,140,.88);display:block}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div id="taskbox">
    <div id="totalbar"><div id="totalfill"></div><span>AUFGABEN GESAMT</span></div>
    <div id="tasklist"></div>
  </div>
  <button class="hudbtn" id="btnPause" aria-label="Pause">⏸<small>PAUSE</small></button>
  <button class="hudbtn" id="btnMap" aria-label="Karte">🗺️<small>KARTE</small></button>
  <button class="hudbtn" id="btnUse" aria-label="Benutzen">✋<small>BENUTZEN</small></button>
  <div id="hint"></div>
  <div id="roomlbl"></div>
  <div id="toast"></div>
</div>
<div id="joy"><i></i></div>

<div id="ov" class="ov hidden"></div>
<div id="mapov" class="ov hidden"><canvas id="mapcv"></canvas></div>
<div id="scr" class="scr hidden"><div class="stars"></div><div class="wrap" id="scrIn"></div></div>

<script>
"use strict";
/* =====================================================================
   Mission Gesetz – ein Top-down-Aufgabenspiel zur Gesetzgebung des Bundes
   ===================================================================== */
const $=id=>document.getElementById(id);
function h(tag,props={},...kids){const n=document.createElement(tag);for(const k in props){const v=props[k];if(v==null||v===false)continue;
  if(k==="class")n.className=v;else if(k==="style")n.style.cssText=v;else if(k.startsWith("on"))n.addEventListener(k.slice(2),v);else if(k==="html")n.innerHTML=v;else n.setAttribute(k,v);}
  for(const c of kids.flat()){if(c==null||c===false)continue;n.append(c.nodeType?c:document.createTextNode(c));}return n;}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- Aussehen der Figuren ---------- */
const SK=["#f3d2b3","#e8b98f","#c98e63","#8d5a3b","#f5dcc5","#6b4429"];
const HC={black:"#1d1a19",brown:"#5a3a22",blond:"#e2c065",grey:"#b9b9b9",red:"#a8442a",white:"#eeeeee"};
const LOOK=(body,skin,hair,style,extra={})=>({body,skin:SK[skin],hair:HC[hair],style,tie:"#c0392b",...extra});

/* ---------- Level-Daten ---------- */
const STEPS=["Ministerium","Bundesrat I","Bundestag: Ausschuss","Bundestag: Beschluss","Bundesrat II + VA","Ausfertigung"];
const LAW="Recht-auf-Reparatur-Gesetz";

const LEVELS=[
/* ------------------------------------------------ 1 */
{title:"Im Ministerium",sub:"Referentenentwurf & Kabinettsbeschluss",art:"Art. 76 I GG",
 intro:`Das Bundesministerium schreibt am ${LAW}: Hersteller sollen Ersatzteile anbieten, damit Handys, Waschmaschinen & Co. repariert statt weggeworfen werden. Bring den Entwurf durch das Haus bis ins Kabinett!`,
 recap:["Fast alle Gesetze beginnen als <b>Referentenentwurf</b> in einem Bundesministerium.","Verbände und Länder dürfen dazu Stellung nehmen (<b>Verbändebeteiligung</b>).","Andere Ministerien zeichnen mit (<b>Ressortabstimmung</b>), das Justizministerium macht die <b>Rechtsprüfung</b>, der Normenkontrollrat prüft die Kosten.","Das <b>Kabinett</b> beschließt den Entwurf – jetzt ist es ein Regierungsentwurf. Der geht zuerst an den <b>Bundesrat</b> (Art. 76 II)."],

    items:[["A. Problem und Ziel",0],["Werbung für einen Handyhersteller",1,"Ein Gesetzentwurf ist neutral – Werbung hat darin nichts verloren."],["B. Lösung",0],["Lieblingsrezept der Ministerin",1],["C. Alternativen",0,"Ja! Das Ministerium muss zeigen, welche anderen Wege es gäbe."],["E. Erfüllungsaufwand (Kosten für Bürger, Wirtschaft, Verwaltung)",0],["Ein Wahlkampf-Slogan",1]]}}]},

  {id:"t4",name:"Verbände anhören",steps:[
    {st:"yilmaz",g:"talk",say:"Gut, dass das Ministerium uns fragt! Bei der <b>Verbändebeteiligung</b> dürfen Verbände und Länder zum Referentenentwurf Stellung nehmen. Unsere Forderung: Ersatzteile müssen mindestens 7 Jahre lang lieferbar sein!"},
    {st:"brandt",g:"talk",say:"Ersatzteile jahrelang lagern? Das kostet uns viel Geld! Wir schicken eine kritische Stellungnahme. Das Ministerium muss am Ende alle Argumente abwägen – so funktioniert Demokratie."}]},
  {id:"t5",name:"Mitzeichnungen sammeln",steps:[
    {st:"nowak",g:"sign",say:"Ressortabstimmung? Klar. Wir im Finanzministerium schauen, ob das Gesetz den Bundeshaushalt belastet. Steht im Vorblatt unter D – passt. Ich zeichne mit!",d:{doc:"Referentenentwurf – Mitzeichnung",who:"BMF, Herr Nowak"}},
    {st:"berger",g:"sign",say:"Wir im Justizministerium prüfen jeden Entwurf auf <b>Verfassungsmäßigkeit</b> und <b>Rechtsförmlichkeit</b> – also ob er sauber formuliert ist. Vorher eine Prüfungsfrage an dich:",
     d:{doc:"Rechtsprüfung bestanden",who:"BMJV, Frau Berger",quiz:{q:"Wer darf einen Gesetzentwurf in den Bundestag einbringen?",a:["Bundesregierung, Bundesrat und Abgeordnete aus der Mitte des Bundestags","Jede Bürgerin und jeder Bürger direkt","Nur der Bundespräsident","Nur die Landtage"],ok:0,
      why:"Richtig! Das Initiativrecht haben nach Art. 76 I GG die Bundesregierung, der Bundesrat und der Bundestag selbst („aus der Mitte“: eine Fraktion oder 5 % der Abgeordneten)."}}},
    {st:"haas",g:"sign",say:"Ich bin vom <b>Nationalen Normenkontrollrat</b>. Wir prüfen, wie viel Bürokratie und Kosten ein Gesetz für Bürger, Wirtschaft und Verwaltung verursacht. Euer Erfüllungsaufwand ist sauber berechnet!",d:{doc:"Stellungnahme des Normenkontrollrats",who:"NKR, Dr. Haas"}}]},
  {id:"t6",name:"Kabinettsbeschluss",needs:["t2","t3","t5"],steps:[
    {st:"kanzlerin",g:"quiz",say:"Willkommen im Kabinett. Alle Ministerien haben mitgezeichnet – das Kabinett beschließt den Entwurf einstimmig. Ab jetzt ist es ein <b>Regierungsentwurf</b>.",
     d:{q:"Wohin muss ein Regierungsentwurf jetzt zuerst?",a:["Direkt in den Bundestag","Zum Bundesrat","Zum Bundespräsidenten","In den Vermittlungsausschuss"],ok:1,
      wrong:{0:"Fast! Aber Regierungsentwürfe müssen zuerst dem Bundesrat vorgelegt werden (Art. 76 II).",2:"Der Bundespräsident kommt ganz am Ende.",3:"Den Vermittlungsausschuss gibt es erst nach dem Beschluss des Bundestags – und nur bei Streit."},
      why:"Genau: Regierungsentwürfe gehen zuerst zum Bundesrat. Er darf in der Regel 6 Wochen lang Stellung nehmen (Art. 76 II) – der „erste Durchgang“."}}]}]},

{title:"Bundesrat – erster Durchgang",sub:"Stellungnahme der Länder",art:"Art. 76 II GG",
 intro:"Der Regierungsentwurf ist im Bundesrat angekommen. Hier wirken die 16 Länder mit. Sammle ihre Stellungnahmen ein und sorge dafür, dass der Bundesrat seine Stellungnahme beschließt.",
 recap:["Im Bundesrat sitzen <b>Mitglieder der Landesregierungen</b> – sie werden nicht direkt gewählt.","Der Bundesrat hat <b>69 Stimmen</b>. Jedes Land hat je nach Einwohnerzahl 3 bis 6 Stimmen und muss sie <b>einheitlich</b> abgeben.","Zu Regierungsentwürfen gibt er in der Regel binnen <b>6 Wochen</b> eine <b>Stellungnahme</b> ab – sie ist nur eine Empfehlung.","Die Bundesregierung antwortet mit einer <b>Gegenäußerung</b> und leitet alles dem <b>Bundestag</b> zu."],

    left:["Bayern","Hessen","Berlin","Bremen"],right:["6 Stimmen","5 Stimmen","4 Stimmen","3 Stimmen"],why:"Länder mit mehr Einwohnern haben mehr Stimmen – aber nicht im gleichen Verhältnis. Insgesamt sind es 69."}}]},
  {id:"t3",name:"Stellungnahmen der Länder einholen",steps:[
    {st:"schmitz",g:"talk",say:"Hallo! Ich bin Ministerin in Nordrhein-Westfalen. Im Bundesrat sitzen keine gewählten Abgeordneten, sondern <b>Mitglieder der Landesregierungen</b>. NRW findet den Entwurf gut – wir wünschen uns nur mehr Reparatur-Cafés."},
    {st:"huber",g:"quiz",say:"Grüß Gott! Bayern hat noch ein paar Anmerkungen. Aber sag mal:",d:{q:"Wie viel Zeit hat der Bundesrat normalerweise für seine Stellungnahme?",a:["3 Tage","6 Wochen","1 Jahr","Unbegrenzt"],ok:1,
      why:"Richtig – in der Regel 6 Wochen (Art. 76 II). Bei besonders eiligen oder umfangreichen Entwürfen gelten andere Fristen."}},
    {st:"wolf",g:"talk",say:"Sachsen möchte, dass kleine Reparaturbetriebe gefördert werden. Das schreiben wir in die Stellungnahme. Aber Achtung: Die Stellungnahme ist nur eine <b>Empfehlung</b> – der Bundestag muss sich nicht daran halten."}]},
  {id:"t4",name:"Fakten-Check für die Presse",steps:[{st:"fakten",g:"sort",d:{title:"Fakten-Check",sub:"Die Pressestelle braucht korrekte Infos über den Bundesrat. Stimmt das?",bins:["✔ Stimmt","✘ Stimmt nicht"],
    items:[["Der Bundesrat hat insgesamt 69 Stimmen.",0],["Jedes Land hat gleich viele Stimmen.",1,"Nein – je nach Einwohnerzahl 3, 4, 5 oder 6 Stimmen (Art. 51 II)."],["Ein Land muss seine Stimmen einheitlich abgeben.",0,"Stimmt (Art. 51 III). Ein Land kann nicht 3 × Ja und 3 × Nein sagen."],["Die Stellungnahme des Bundesrats ist für den Bundestag bindend.",1,"Nein, sie ist eine Empfehlung."],["Die Mitglieder des Bundesrats werden direkt vom Volk gewählt.",1,"Nein – die Landesregierungen schicken sie."]]}}]},
  {id:"t5",name:"Stellungnahme beschließen",steps:[{st:"stempel",g:"stamp",d:{title:"Stellungnahme beschließen",sub:"Die Ausschüsse haben vorbereitet – jetzt alle Seiten abstempeln!",doc:"Stellungnahme des Bundesrates",mark:"BESCHLOSSEN",n:4}}]},
  {id:"t6",name:"Stellungnahme weiterleiten",needs:["t2","t3","t4","t5"],steps:[{st:"praes",g:"quiz",say:"Die Stellungnahme ist beschlossen. Vielen Dank für deine Arbeit!",
    d:{q:"Wie geht es mit dem Entwurf jetzt weiter?",a:["Der Bundesrat schickt ihn direkt zum Bundespräsidenten","Die Bundesregierung schreibt eine Gegenäußerung und leitet alles dem Bundestag zu","Das Gesetz ist damit beschlossen","Die Länder stimmen per Volksentscheid ab"],ok:1,
     wrong:{0:"Viel zu früh – der Bundestag hat noch gar nicht beraten!",2:"Nein, der Bundesrat hat nur Stellung genommen. Beschließen muss der Bundestag.",3:"Volksentscheide über Bundesgesetze gibt es im Grundgesetz nicht."},
     why:"Richtig! Die Bundesregierung antwortet mit einer Gegenäußerung und schickt Entwurf, Stellungnahme und Gegenäußerung an den Bundestag."}}]}]},

function beep(f=600,d=.08,type="square",vol=.05,delay=0){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+delay;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}

/* =====================================================================
   Welt / Karte
   ===================================================================== */
const CW=660, CH=540, MG=140, RW=460, RH=340, CT=120, WT=22, FACE=48;
let W=null; // aktuelle Welt

function buildWorld(L){
  const rooms={}, rects=[], obst=[], decos=[];
  let cols=0, rows=0;
  for(const r of L.rooms){
    const w=r.w||RW, hh=r.h||RH;
    const x=MG+r.c*CW+(CW-w)/2, y=MG+r.r*CH+(CH-hh)/2;
    rooms[r.id]={...r,x,y,w,h:hh,cx:x+w/2,cy:y+hh/2};
    cols=Math.max(cols,r.c+1);rows=Math.max(rows,r.r+1);
  }
  const corr=[];
  for(const [a,b] of L.links){
    const A=rooms[a],B=rooms[b];
    if(A.r===B.r){const [l,r]=A.x<B.x?[A,B]:[B,A];corr.push({x:l.x+l.w-6,y:l.cy-CT/2,w:r.x-(l.x+l.w)+12,h:CT,corr:true});}
    else{const [t,bt]=A.y<B.y?[A,B]:[B,A];corr.push({x:t.cx-CT/2,y:t.y+t.h-6,w:CT,h:bt.y-(t.y+t.h)+12,corr:true});}
  }
  for(const id in rooms) rects.push(rooms[id]);
  rects.push(...corr);
  // Deko
  for(const id in rooms){const R=rooms[id];for(const d of R.deco||[])makeDeco(d,R,obst,decos);}
  const world={L,rooms,corr,rects,obst,decos,w:MG*2+cols*CW,h:MG*2+rows*CH};
  // Stationen
  world.st={};
  for(const s of L.st){
    const R=rooms[s.room];
    const o={...s};
    if(s.wander){
      const path=s.wander.map(id=>({x:rooms[id].cx,y:rooms[id].cy+20}));
      o.path=path;o.pi=0;o.dir=1;o.x=path[0].x;o.y=path[0].y;o.wait=Math.random()*2;o.face=1;o.phase=0;o.moving=false;
    }else{o.x=R.x+R.w*s.x;o.y=R.y+R.h*s.y;o.face=s.x>.5?-1:1;}
    world.st[s.id]=o;
  }
  return world;
}

function makeDeco(kind,R,obst,decos){
  const P=(fx,fy)=>[R.x+R.w*fx,R.y+R.h*fy];
  const solid=(x,y,w,h)=>obst.push({x,y,w,h});
  if(kind==="desks"){
    for(const fx of [.1,.66])for(const fy of [.6]){const [x,y]=P(fx,fy),w=R.w*.24,hh=46;solid(x,y,w,hh);decos.push({t:"desk",x,y,w,h:hh});}
  }else if(kind==="shelves"){
    const segs=[[.04,.36],[.64,.96]];
    for(const [a,b] of segs){const [x,y]=P(a,0);const w=R.w*(b-a);solid(x,y,w,38);decos.push({t:"shelf",x,y,w,h:38});}
  }else if(kind==="printers"){
    for(const fx of [.12,.78]){const [x,y]=P(fx,0);solid(x+4,y,52,40);decos.push({t:"copier",x:x+4,y,w:52,h:40});}
    const [x,y]=P(.08,.72);solid(x,y,R.w*.22,40);decos.push({t:"desk",x,y,w:R.w*.22,h:40,paper:true});
  }else if(kind==="round"){
    for(const [fx,fy] of [[.2,.34],[.8,.34],[.2,.76],[.8,.76]]){const [x,y]=P(fx,fy);const r=32;solid(x-r+6,y-r+8,2*r-12,2*r-14);decos.push({t:"rtable",x,y,r});}
  }else if(kind==="sofas"){
    for(const [fx,fy] of [[.1,.64],[.66,.64]]){const [x,y]=P(fx,fy);const w=R.w*.24;solid(x,y,w,50);decos.push({t:"sofa",x,y,w,h:50});}
  }else if(kind==="oval"){
    const [x,y]=P(.26,.42);const w=R.w*.48,hh=R.h*.32;solid(x+10,y+6,w-20,hh-12);decos.push({t:"oval",x,y,w,h:hh});
  }else if(kind==="plenum"){
    decos.push({t:"plenum",x:R.cx,y:R.y+R.h*.30,R});
  }else if(kind==="rug"){
    decos.push({t:"rug",x:R.x+R.w*.3,y:R.y+R.h*.3,w:R.w*.4,h:R.h*.44});
  }else if(kind==="plants"){
    for(const [fx,fy] of [[.06,.86],[.94,.86]]){const [x,y]=P(fx,fy);solid(x-14,y-8,28,16);decos.push({t:"plant",x,y});}
  }else if(kind==="trees"){
    for(const [fx,fy] of [[.15,.25],[.85,.25],[.15,.8],[.85,.8]]){const [x,y]=P(fx,fy);solid(x-16,y-8,32,18);decos.push({t:"tree",x,y});}
    decos.push({t:"flowers",R});
  }
}

/* ---------- Kollision ---------- */
const FX=14, FY=7;
function inRects(x,y){for(const r of W.rects)if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)return true;return false;}
function freeAt(x,y){
  if(!inRects(x-FX,y-FY)||!inRects(x+FX,y-FY)||!inRects(x-FX,y+FY)||!inRects(x+FX,y+FY))return false;
  for(const o of W.obst)if(x+FX>o.x&&x-FX<o.x+o.w&&y+FY>o.y&&y-FY<o.y+o.h)return false;
  return true;
}
function roomAt(x,y){for(const id in W.rooms){const r=W.rooms[id];if(x>=r.x&&x<=r.x+r.w&&y>=r.y-10&&y<=r.y+r.h)return r;}return null;}

function rr(c,x,y,w,hh,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+hh,r);c.arcTo(x+w,y+hh,x,y+hh,r);c.arcTo(x,y+hh,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function shade(hex,amt){let n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const f=amt<0?0:255,p=Math.abs(amt);r=Math.round(r+(f-r)*p);g=Math.round(g+(f-g)*p);b=Math.round(b+(f-b)*p);return "#"+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);}
const OL="#15171d";

/* Figur (eigener Stil: kleine Politiker-Figur im Anzug) */
function drawPerson(c,x,y,look,o={}){
  const f=o.face||1, ph=o.phase||0, mv=!!o.moving, s=o.scale||1;
  c.save();c.translate(x,y);c.scale(s,s);
  if(!o.noShadow){c.fillStyle="rgba(0,0,0,.28)";c.beginPath();c.ellipse(0,0,21,7,0,0,Math.PI*2);c.fill();}
  const bob=mv?-Math.abs(Math.sin(ph))*3.5:0;
  c.translate(0,bob);c.scale(f,1);
  c.lineWidth=3;c.strokeStyle=OL;c.lineJoin="round";
  const sw=mv?Math.sin(ph)*5:0;
  const pants=shade(look.body,-.45);
  // Beine
  c.fillStyle=pants;
  rr(c,-12+sw,-16,10,16,4);c.fill();c.stroke();
  rr(c,2-sw,-16,10,16,4);c.fill();c.stroke();
  // hinterer Arm
  c.fillStyle=shade(look.body,-.22);
  c.save();c.translate(-15,-46);c.rotate(mv?-Math.sin(ph)*.5:.08);rr(c,-5,0,10,24,5);c.fill();c.stroke();c.restore();
  // Körper
  c.fillStyle=look.body;rr(c,-17,-52,34,40,12);c.fill();c.stroke();
  c.fillStyle="rgba(0,0,0,.14)";rr(c,-15,-50,10,36,8);c.fill();
  c.fillStyle="rgba(255,255,255,.16)";rr(c,6,-48,7,14,4);c.fill();
  // Hemd + Krawatte
  c.fillStyle="#fff";c.beginPath();c.moveTo(-6,-51);c.lineTo(8,-51);c.lineTo(1,-38);c.closePath();c.fill();
  c.fillStyle=look.tie||"#c0392b";c.beginPath();c.moveTo(-1,-49);c.lineTo(3,-49);c.lineTo(4.5,-34);c.lineTo(1,-30);c.lineTo(-2.5,-34);c.closePath();c.fill();
  // vorderer Arm
  c.fillStyle=look.body;
  c.save();c.translate(15,-46);c.rotate(mv?Math.sin(ph)*.5:-.08);rr(c,-5,0,10,24,5);c.fill();c.stroke();
  c.fillStyle=look.skin;c.beginPath();c.arc(0,25,4.5,0,Math.PI*2);c.fill();c.stroke();c.restore();
  // Kopf
  const hx=2, hy=-66;
  if(look.style==="long"){c.fillStyle=look.hair;rr(c,hx-17,hy-10,26,30,10);c.fill();c.stroke();}
  c.fillStyle=look.skin;c.beginPath();c.arc(hx,hy,15,0,Math.PI*2);c.fill();c.stroke();
  // Haare
  c.fillStyle=look.hair;
  if(look.style!=="bald"){
    c.beginPath();
    if(look.style==="curly"){for(let i=0;i<6;i++){const a=Math.PI*(1.05+i*.19);c.moveTo(hx+Math.cos(a)*13+6,hy+Math.sin(a)*13);c.arc(hx+Math.cos(a)*13,hy+Math.sin(a)*13,6,0,Math.PI*2);}c.fill();}
    else{c.arc(hx,hy,15.5,Math.PI*1.02,Math.PI*1.98);c.quadraticCurveTo(hx+4,hy-6,hx-6,hy-4);c.quadraticCurveTo(hx-12,hy-2,hx-15,hy+4);c.closePath();c.fill();c.stroke();}
    if(look.style==="bun"){c.beginPath();c.arc(hx-11,hy-13,6.5,0,Math.PI*2);c.fill();c.stroke();}
  }else{c.beginPath();c.arc(hx-12,hy+1,4,0,Math.PI*2);c.fill();}
  // Gesicht
  c.fillStyle=OL;c.beginPath();c.arc(hx+5,hy+1,1.9,0,Math.PI*2);c.arc(hx+11,hy+1,1.9,0,Math.PI*2);c.fill();
  c.lineWidth=1.6;c.beginPath();c.arc(hx+8,hy+6,3,.2,Math.PI-.2);c.stroke();
  c.fillStyle="rgba(230,90,90,.35)";c.beginPath();c.arc(hx+13,hy+5,2.5,0,Math.PI*2);c.fill();
  if(look.glasses){c.strokeStyle=OL;c.lineWidth=1.6;c.beginPath();c.arc(hx+5,hy+1,3.8,0,Math.PI*2);c.moveTo(hx+14.8,hy+1);c.arc(hx+11,hy+1,3.8,0,Math.PI*2);c.stroke();}
  c.restore();
}

    c.fillStyle="#62d4ff";c.fillRect(x-13,y-53,26,18);c.fillStyle="#2aa0d0";c.fillRect(x-10,y-49,14,3);c.fillRect(x-10,y-44,9,3);}

    c.fillStyle=(performance.now()/500|0)%2?"#3ddc6f":"#1a5a2e";c.beginPath();c.arc(x,y-54,4,0,7);c.fill();}

    c.fillStyle="#fff";c.fillRect(x-14,y-46,28,12);c.strokeRect(x-14,y-46,28,12);c.fillStyle="#3ddc6f";c.fillRect(x+16,y-14,6,4);}
  else if(t==="cabinet"){c.fillStyle="#8b6a46";rr(c,x-22,y-56,44,56,4);c.fill();c.stroke();c.shadowBlur=0;c.strokeStyle=OL;c.lineWidth=2;
    for(let i=0;i<3;i++){c.strokeRect(x-17,y-51+i*17,34,13);c.fillStyle="#d8c07a";c.fillRect(x-5,y-46+i*17,10,3);}}
  else if(t==="stampdesk"){c.fillStyle="#9a6b42";rr(c,x-34,y-30,68,30,4);c.fill();c.stroke();c.shadowBlur=0;c.fillStyle="#fff";c.fillRect(x-24,y-27,22,16);
    c.fillStyle="#c0392b";c.fillRect(x+8,y-34,12,10);c.fillStyle="#333";c.fillRect(x+11,y-44,6,10);}
  else if(t==="podium"){c.fillStyle="#7a5232";c.beginPath();c.moveTo(x-24,y);c.lineTo(x+24,y);c.lineTo(x+18,y-40);c.lineTo(x-18,y-40);c.closePath();c.fill();c.stroke();c.shadowBlur=0;
    c.fillStyle="#333";c.fillRect(x-1,y-56,3,16);c.beginPath();c.arc(x,y-57,4,0,7);c.fill();c.fillStyle="#e2c065";c.font="bold 14px sans-serif";c.textAlign="center";c.fillText("§",x,y-16);}
  else if(t==="board"){c.fillStyle="#666";c.fillRect(x-30,y-6,4,6);c.fillRect(x+26,y-6,4,6);c.fillStyle="#f4f4f4";rr(c,x-34,y-60,68,52,4);c.fill();c.stroke();c.shadowBlur=0;
    c.strokeStyle="#2f6fd6";c.lineWidth=2;c.beginPath();c.moveTo(x-24,y-46);c.lineTo(x+20,y-46);c.moveTo(x-24,y-36);c.lineTo(x+8,y-36);c.stroke();c.strokeStyle="#c0392b";c.beginPath();c.moveTo(x-24,y-24);c.lineTo(x+14,y-24);c.stroke();}
  else if(t==="mailbox"){c.fillStyle="#8b6a46";rr(c,x-30,y-56,60,56,4);c.fill();c.stroke();c.shadowBlur=0;c.strokeStyle=OL;c.lineWidth=2;
    for(let i=0;i<3;i++)for(let j=0;j<3;j++)c.strokeRect(x-25+j*17,y-51+i*17,15,14);}
  else if(t==="vote"){c.fillStyle="#7a5232";rr(c,x-26,y-34,52,34,5);c.fill();c.stroke();c.shadowBlur=0;c.fillStyle="#c9ccd3";c.beginPath();c.ellipse(x,y-36,20,9,0,0,7);c.fill();c.stroke();
    c.fillStyle="#e5484d";c.beginPath();c.ellipse(x,y-41,13,6,0,0,7);c.fill();c.stroke();c.fillStyle="#ffd84a";c.fillRect(x-14,y-20,28,6);}

/* Böden */
const PAT={};
function floorPattern(style,base){
  const k=style+base;if(PAT[k])return PAT[k];
  const p=document.createElement("canvas");const n=64;p.width=p.height=n;const c=p.getContext("2d");
  c.fillStyle=base;c.fillRect(0,0,n,n);
  const dk=shade(base,-.12),lt=shade(base,.08);
  if(style==="tile"){c.strokeStyle=dk;c.lineWidth=2;c.strokeRect(1,1,n/2,n/2);c.strokeRect(n/2+1,1,n/2,n/2);c.strokeRect(1,n/2+1,n/2,n/2);c.strokeRect(n/2+1,n/2+1,n/2,n/2);
    c.fillStyle=lt;c.fillRect(3,3,8,3);c.fillRect(n/2+3,n/2+3,8,3);}
  else if(style==="wood"){c.strokeStyle=dk;c.lineWidth=2;for(let i=0;i<4;i++){c.beginPath();c.moveTo(0,i*16+1);c.lineTo(n,i*16+1);c.stroke();c.beginPath();const o=(i*23)%n;c.moveTo(o,i*16);c.lineTo(o,i*16+16);c.stroke();}
    c.fillStyle=lt;c.fillRect(6,6,20,2);c.fillRect(36,38,18,2);}
  else if(style==="carpet"){c.fillStyle=dk;for(let i=0;i<n;i+=8)for(let j=(i/8)%2*4;j<n;j+=8)c.fillRect(i,j,2,2);}
  else if(style==="marble"){c.strokeStyle=dk;c.lineWidth=2;c.beginPath();c.moveTo(0,n/2);c.lineTo(n/2,0);c.lineTo(n,n/2);c.lineTo(n/2,n);c.closePath();c.stroke();c.fillStyle=lt;c.fillRect(n/2-6,n/2-1,12,2);}
  else if(style==="grass"){c.fillStyle=dk;for(let i=0;i<40;i++){c.fillRect((i*37)%n,(i*53)%n,2,4);}c.fillStyle=lt;for(let i=0;i<14;i++)c.fillRect((i*29+7)%n,(i*41+3)%n,2,3);}
  else if(style==="metal"){c.strokeStyle=dk;c.lineWidth=2;c.strokeRect(1,1,n-2,n-2);c.fillStyle=dk;for(const [a,b] of [[6,6],[n-8,6],[6,n-8],[n-8,n-8]])c.fillRect(a,b,3,3);}
  return PAT[k]=ctx.createPattern(p,"repeat");
}

let STATIC=null, SS=1;
function renderStatic(){
  SS=Math.min(DPR,1.5,4096/W.w,4096/W.h);
  const can=document.createElement("canvas");can.width=Math.ceil(W.w*SS);can.height=Math.ceil(W.h*SS);
  const c=can.getContext("2d");c.scale(SS,SS);
  // Außenwände
  const grow=(r,t,top)=>[r.x-t,r.y-t-top,r.w+2*t,r.h+2*t+top];
  c.fillStyle="#07080c";for(const r of W.rects)c.fillRect(...grow(r,WT+4,FACE));
  c.fillStyle="#3d4555";for(const r of W.rects)c.fillRect(...grow(r,WT,FACE));
  // Wandflächen (oben)
  for(const r of W.rects){
    const base=r.corr?"#566074":shade(r.floor,-.35);
    c.fillStyle=base;c.fillRect(r.x,r.y-FACE,r.w,FACE);
    c.fillStyle=shade(base,.12);c.fillRect(r.x,r.y-FACE,r.w,6);
    c.fillStyle=shade(base,-.25);c.fillRect(r.x,r.y-8,r.w,8);
    if(!r.corr){c.fillStyle=shade(base,-.1);for(let x=r.x+30;x<r.x+r.w-20;x+=60)c.fillRect(x,r.y-FACE+10,3,FACE-20);}
  }
  // Böden
  for(const r of W.corr){c.fillStyle=floorPattern("metal","#6b7384");c.fillRect(r.x,r.y,r.w,r.h);}
  for(const id in W.rooms){const r=W.rooms[id];c.fillStyle=floorPattern(r.pat,r.floor);c.fillRect(r.x,r.y,r.w,r.h);}
  // Schatten unter der Wand
  for(const r of W.rects){const g=c.createLinearGradient(0,r.y,0,r.y+18);g.addColorStop(0,"rgba(0,0,0,.28)");g.addColorStop(1,"rgba(0,0,0,0)");c.fillStyle=g;c.fillRect(r.x,r.y,r.w,18);}
  // Raumnamen auf dem Boden
  c.font="900 22px 'Trebuchet MS',sans-serif";c.textAlign="center";
  for(const id in W.rooms){const r=W.rooms[id];c.fillStyle="rgba(255,255,255,.13)";c.fillText(r.name.toUpperCase(),r.cx,r.y+r.h-16);}
  // Deko
  for(const d of W.decos)drawDeco(c,d);
  STATIC=can;
}
function drawDeco(c,d){
  c.save();c.lineWidth=3;c.strokeStyle=OL;c.lineJoin="round";
  if(d.t==="desk"){c.fillStyle="#9a6b42";rr(c,d.x,d.y,d.w,d.h,5);c.fill();c.stroke();c.fillStyle="#b9875a";c.fillRect(d.x+4,d.y+4,d.w-8,5);
    if(d.paper){for(let i=0;i<3;i++){c.fillStyle="#fff";c.fillRect(d.x+10+i*26,d.y+10,18,22);}}
    else{c.fillStyle="#3a404c";rr(c,d.x+d.w/2-16,d.y+6,32,20,3);c.fill();c.stroke();c.fillStyle="#62d4ff";c.fillRect(d.x+d.w/2-12,d.y+10,24,12);
      c.fillStyle="#fff";c.fillRect(d.x+10,d.y+12,14,18);c.fillStyle="#3b3f48";for(const dx of [.25,.75]){c.beginPath();c.arc(d.x+d.w*dx,d.y+d.h+14,10,0,7);c.fill();c.stroke();}}}
  else if(d.t==="shelf"){c.fillStyle="#6e4f32";rr(c,d.x,d.y-30,d.w,d.h+30,4);c.fill();c.stroke();
    const cols=["#c0392b","#2f6fd6","#2fa956","#e2c065","#8e44ad","#e67e22"];for(let x=d.x+6,i=0;x<d.x+d.w-10;x+=9,i++){c.fillStyle=cols[(i*7)%6];c.fillRect(x,d.y-24+(i%3),7,22-(i%3));c.fillStyle=cols[(i*5+2)%6];c.fillRect(x,d.y+4+(i%2),7,22-(i%2));}}
  else if(d.t==="copier"){c.fillStyle="#cfd3da";rr(c,d.x,d.y-20,d.w,d.h+20,5);c.fill();c.stroke();c.fillStyle="#7d848f";c.fillRect(d.x+6,d.y-12,d.w-12,8);c.fillStyle="#3ddc6f";c.fillRect(d.x+d.w-14,d.y+d.h-12,6,4);}
  else if(d.t==="rtable"){c.fillStyle="#3b3f48";for(const a of [0,1.57,3.14,4.71]){c.beginPath();c.arc(d.x+Math.cos(a)*40,d.y+Math.sin(a)*34,9,0,7);c.fill();c.stroke();}
    c.fillStyle="#e8e8e8";c.beginPath();c.ellipse(d.x,d.y,d.r,d.r*.8,0,0,7);c.fill();c.stroke();c.fillStyle="#d3d3d3";c.beginPath();c.ellipse(d.x,d.y+3,d.r-8,d.r*.8-8,0,0,7);c.fill();}
  else if(d.t==="sofa"){c.fillStyle="#7b3f3f";rr(c,d.x,d.y,d.w,d.h,10);c.fill();c.stroke();c.fillStyle="#9a5252";rr(c,d.x+8,d.y+14,d.w-16,d.h-20,6);c.fill();}
  else if(d.t==="oval"){c.fillStyle="#3b3f48";const n=6;for(let i=0;i<n;i++){const fx=d.x+d.w*(i+.5)/n;for(const fy of [d.y-10,d.y+d.h+10]){c.beginPath();c.arc(fx,fy,9,0,7);c.fill();c.stroke();}}
    c.fillStyle="#6e4a2e";c.beginPath();c.ellipse(d.x+d.w/2,d.y+d.h/2,d.w/2,d.h/2,0,0,7);c.fill();c.stroke();c.fillStyle="#86603f";c.beginPath();c.ellipse(d.x+d.w/2,d.y+d.h/2-3,d.w/2-10,d.h/2-10,0,0,7);c.fill();
    c.fillStyle="#fff";for(let i=0;i<4;i++)c.fillRect(d.x+d.w*(.18+i*.19),d.y+d.h*.35,14,10);}
  else if(d.t==="plenum"){const R=d.R;const cx=R.cx,cy=R.y+R.h*.08;
    const seat=R.floor==="#4b6fa8"?"#2a54a8":"#3d5a8a";
    for(let row=0;row<4;row++){const rad=R.h*(.40+row*.14);const st=26/(rad*1.2);
      for(let a=.12;a<=Math.PI-.12;a+=st){const sx=cx+Math.cos(a)*rad*1.2,sy=cy+Math.sin(a)*rad;
        if(Math.abs(sx-cx)<62||Math.abs(sy-R.cy-20)<46)continue;
        if(sx<R.x+18||sx>R.x+R.w-18||sy>R.y+R.h-34||sy<R.y+R.h*.3)continue;
        c.fillStyle=seat;c.lineWidth=2;rr(c,sx-9,sy-7,18,14,4);c.fill();c.stroke();}}
    c.fillStyle="rgba(0,0,0,.15)";c.fillRect(cx-R.w*.22,R.y+4,R.w*.44,R.h*.16);
    c.fillStyle="#e2c065";c.font="900 30px serif";c.textAlign="center";c.fillText("§",cx,R.y-14);}
  else if(d.t==="rug"){c.fillStyle="#8e2b3a";rr(c,d.x,d.y,d.w,d.h,8);c.fill();c.strokeStyle="#e2c065";c.lineWidth=3;rr(c,d.x+8,d.y+8,d.w-16,d.h-16,6);c.stroke();}
  else if(d.t==="plant"){c.fillStyle="#7a4b2a";rr(c,d.x-12,d.y-18,24,20,4);c.fill();c.stroke();c.fillStyle="#2fa956";
    for(const [dx,dy] of [[-10,-28],[10,-28],[0,-38],[-4,-24],[6,-22]]){c.beginPath();c.arc(d.x+dx,d.y+dy,10,0,7);c.fill();c.stroke();}}
  else if(d.t==="tree"){c.fillStyle="rgba(0,0,0,.25)";c.beginPath();c.ellipse(d.x,d.y+2,30,10,0,0,7);c.fill();c.fillStyle="#6b4429";c.fillRect(d.x-6,d.y-26,12,28);c.strokeRect(d.x-6,d.y-26,12,28);
    c.fillStyle="#2f7d32";for(const [dx,dy,r] of [[-16,-40,18],[16,-40,18],[0,-56,22],[0,-34,18]]){c.beginPath();c.arc(d.x+dx,d.y+dy,r,0,7);c.fill();c.stroke();}
    c.fillStyle="#4caf50";c.beginPath();c.arc(d.x-6,d.y-60,8,0,7);c.fill();}
  else if(d.t==="flowers"){const R=d.R;const cols=["#ffd84a","#ec6fb3","#fff","#e5484d"];for(let i=0;i<26;i++){const x=R.x+20+((i*97)%(R.w-40)),y=R.y+20+((i*61)%(R.h-40));
    if(Math.abs(x-R.cx)<80||Math.abs(y-R.cy)<70)continue;c.fillStyle=cols[i%4];c.beginPath();c.arc(x,y,4,0,7);c.fill();}}
  c.restore();
}

let G=null; // laufendes Level
const keys=new Set();
let joy=null;

function startLevel(i){
  const L=LEVELS[i];
  closeOv();toggleMap(false);
  W=buildWorld(L);
  renderStatic();
  const sp=W.rooms[L.spawn];
  G={i,L,px:sp.cx,py:sp.cy+40,face:1,phase:0,moving:false,done:{},prog:{},target:null,room:null,over:false,cam:{x:sp.cx,y:sp.cy},t:0,busy:false};
  for(const t of L.tasks){G.prog[t.id]=t.steps.map(()=>false);}
  showIntro();
}

function taskDone(t){return G.prog[t.id].every(Boolean);}
function taskOpen(t){return (t.needs||[]).every(id=>taskDone(L_task(id)));}
function L_task(id){return G.L.tasks.find(t=>t.id===id);}
function availSteps(){ // Liste offener, verfügbarer Schritte
  const out=[];
  for(const t of G.L.tasks){if(taskDone(t)||!taskOpen(t))continue;
    t.steps.forEach((s,k)=>{if(G.prog[t.id][k])return;if(t.ordered&&G.prog[t.id].indexOf(false)!==k)return;out.push({t,k,s});});}
  return out;
}
function stepFor(stId){return availSteps().find(a=>a.s.st===stId)||null;}

/* ---------- Eingabe ---------- */
addEventListener("keydown",e=>{
  if(!G||G.over)return;
  const k=e.key.toLowerCase();
  if(!$("ov").classList.contains("hidden")||!$("scr").classList.contains("hidden")){if(k==="escape"&&!$("ov").classList.contains("hidden"))(closeHandler||closeOv)();return;}

  if(["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d"].includes(k)){keys.add(k);e.preventDefault();}

/* ---------- Update ---------- */
const SPEED=250;
function update(dt){
  if(!G||G.over)return;
  G.t+=dt;
  const paused=G.busy||!$("ov").classList.contains("hidden")||!$("mapov").classList.contains("hidden")||!$("scr").classList.contains("hidden");
  // NPCs laufen
  for(const id in W.st){const s=W.st[id];if(!s.path)continue;
    if(paused&&G.talkTo===id){s.moving=false;continue;}
    const near=Math.hypot(s.x-G.px,s.y-G.py)<80 && stepFor(id);
    if(s.wait>0||near){s.wait-=dt;s.moving=false;continue;}
    const tg=s.path[s.pi];const dx=tg.x-s.x,dy=tg.y-s.y,d=Math.hypot(dx,dy);
    if(d<3){s.wait=1.2+Math.random()*2.5;let ni=s.pi+s.dir;if(ni<0||ni>=s.path.length){s.dir*=-1;ni=s.pi+s.dir;}s.pi=ni;s.moving=false;}
    else{const sp=95*dt;s.x+=dx/d*Math.min(sp,d);s.y+=dy/d*Math.min(sp,d);s.face=dx>1?1:dx<-1?-1:s.face;s.phase+=dt*11;s.moving=true;}
  }
  if(paused){G.moving=false;return;}
  let vx=0,vy=0;
  if(keys.has("arrowleft")||keys.has("a"))vx-=1;if(keys.has("arrowright")||keys.has("d"))vx+=1;
  if(keys.has("arrowup")||keys.has("w"))vy-=1;if(keys.has("arrowdown")||keys.has("s"))vy+=1;
  if(joy&&Math.hypot(joy.dx,joy.dy)>.18){vx=joy.dx;vy=joy.dy;}
  const m=Math.hypot(vx,vy);
  if(m>0){if(m>1){vx/=m;vy/=m;}
    const nx=G.px+vx*SPEED*dt, ny=G.py+vy*SPEED*dt;
    if(freeAt(nx,G.py))G.px=nx;if(freeAt(G.px,ny))G.py=ny;
    if(Math.abs(vx)>.1)G.face=vx>0?1:-1;G.phase+=dt*13;G.moving=true;}
  else G.moving=false;
  // Ziel suchen
  let best=null,bd=1e9;
  for(const a of availSteps()){const s=W.st[a.s.st];const d=Math.hypot(s.x-G.px,(s.y-G.py)*1.15);const R=s.npc?78:72;
    if(d<R&&d<bd){bd=d;best=a;}}
  G.target=best;
  $("btnUse").classList.toggle("on",!!best);
  const r=roomAt(G.px,G.py);const rn=r?r.name:"Flur";
  if(rn!==G.room){G.room=rn;$("roomlbl").textContent=rn;}
  $("hint").textContent=best?(W.st[best.s.st].npc?"💬 "+W.st[best.s.st].npc.name+" – ansprechen":"✋ "+best.t.name):"";
}

  function line(a,b,col,dash){const l=document.createElementNS(svgNS,"line");l.setAttribute("x1",a[0]);l.setAttribute("y1",a[1]);l.setAttribute("x2",b[0]);l.setAttribute("y2",b[1]);
    l.setAttribute("stroke",col);l.setAttribute("stroke-width","8");l.setAttribute("stroke-linecap","round");if(dash)l.setAttribute("opacity",".6");sv.append(l);return l;}
  function pick(el){if(el.classList.contains("done"))return;lefts.forEach(x=>x.classList.remove("sel"));sel=el;el.classList.add("sel");sfx.click();}
  function tryMatch(r){if(!sel||r.classList.contains("done"))return;
    if(r.dataset.i===sel.dataset.i){const i=+sel.dataset.i;line(pos(sel,0),pos(r,1),cols[i]);r.querySelector(".plug").style.background=cols[i];
      sel.classList.add("done");r.classList.add("done");sel.classList.remove("sel");sel=null;matched++;sfx.ok();
      if(matched===d.left.length){fb.className="feedback good";fb.innerHTML="✔ Alles verbunden!"+(d.why?" "+d.why:"");p.append(h("div",{class:"row"},h("button",{class:"btn go",onclick:done},"Weiter ▶")));}}
    else{sfx.bad();r.animate([{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"none"}],{duration:250});fb.className="feedback bad";fb.innerHTML="✘ Passt nicht – versuch eine andere Verbindung.";}}
  lefts.forEach(el=>{el.addEventListener("pointerdown",e=>{pick(el);try{el.releasePointerCapture(e.pointerId);}catch(_){}});});
  rights.forEach(el=>{el.addEventListener("pointerup",()=>tryMatch(el));});
  wrap.addEventListener("pointermove",e=>{if(!sel||!(e.buttons&1)){if(tmp){tmp.remove();tmp=null;}return;}const wr=wrap.getBoundingClientRect();
    if(tmp)tmp.remove();tmp=line(pos(sel,0),[e.clientX-wr.left,e.clientY-wr.top],cols[+sel.dataset.i],true);});
  addEventListener("pointerup",()=>{if(tmp){tmp.remove();tmp=null;}},{once:false});
}

/* Zählen mit Ziffernblock */
function gCount(d,done){
  const p=panel(d.title,d.sub);

  if(d.cards){const arr=shuffle([...Array(d.cards.ja).fill("ja"),...Array(d.cards.nein).fill("nein"),...Array(d.cards.enth).fill("enth")]);
    arr.forEach(v=>box.append(h("div",{class:"vc "+v},v==="ja"?"JA":v==="nein"?"NEIN":"ENTH.")));answer=d.cards.ja;}
  else{d.laender.forEach(([n,v,s])=>{box.append(h("div",{class:"land",style:`background:${s==="ja"?"#3ba55c":s==="nein"?"#d9534f":"#c9ccd3"};color:${s==="enth"?"#222":"#fff"}`},n,h("b",{},v)));if(s==="ja")answer+=v;});}
  const disp=h("div",{class:"lcd",style:"font-size:26px;margin-top:12px"},"0");let val="";
  const fb=h("div",{class:"feedback hidden"});let solved=false;

    if(k==="⌫")val=val.slice(0,-1);
    else if(k==="OK"){if(+val===answer){solved=true;sfx.ok();disp.style.color="#6cff8b";fb.className="feedback good";fb.innerHTML="✔ "+(d.why||"Richtig gezählt!");

      else{sfx.bad();disp.style.color="#ff6b6b";fb.className="feedback bad";fb.innerHTML="✘ Das stimmt nicht – zähl nochmal nach.";setTimeout(()=>{disp.style.color="";},600);val="";}}

  const pad=h("div",{class:"keypad"},["1","2","3","4","5","6","7","8","9","⌫","0","OK"].map(k=>h("button",{class:"btn"+(k==="OK"?" go":""),onclick:()=>press(k)},k)));
  p.append(h("div",{class:"screen"},box),disp,pad,fb);openOv(p);
}

function gVote(d,done){

  const people=[{n:save.name||"Du",look:LOOK(save.color,0,"brown","short",{tie:"#1d2430"}),me:true},
    ...G.L.st.filter(s=>s.npc).map(s=>({n:s.npc.name,look:s.npc.look})),
    {n:"Abg. Jansen",look:LOOK("#6a4c93",1,"black","short")},{n:"Abg. Weiß",look:LOOK("#e07a3f",0,"grey","bun")},{n:"Abg. Öztürk",look:LOOK("#3aa0a0",2,"black","curly")},
    {n:"Abg. Hoffmann",look:LOOK("#4b4f58",0,"blond","long")},{n:"Abg. Nguyen",look:LOOK("#c0392b",1,"black","short",{glasses:true})}];

  p.append(grid,mine,res);openOv(p);
  function cast(my){mine.remove();sfx.click();
    const all=[my,...people.slice(1).map((_,i)=>votes[i%votes.length])];
    all.forEach((v,i)=>setTimeout(()=>{const vb=tiles[i].vb;vb.className="vb "+v;vb.textContent=v==="ja"?"JA":v==="nein"?"NEIN":"ENTH.";void vb.offsetWidth;vb.classList.add("show");beep(300+i*40,.06);},400+i*260));
    setTimeout(()=>{sfx.win();
      res.innerHTML=`<div style="font-size:15px;color:#cfd6e2;font-weight:700">Ergebnis im ganzen Bundestag:</div>✔ ${d.ja} Ja · ✘ ${d.nein} Nein · ${d.enth} Enthaltungen<div style="color:var(--green);margin-top:6px;font-size:26px">ANGENOMMEN!</div>`;
      res.append(h("div",{class:"feedback good",style:"text-align:left;font-size:14.5px;font-weight:400"},"Mehr Ja- als Nein-Stimmen: Die einfache Mehrheit der abgegebenen Stimmen ist erreicht (Art. 42 II). Der Bundestagspräsident leitet das Gesetz jetzt an den Bundesrat weiter."),
        h("div",{class:"row"},h("button",{class:"btn go",onclick:done},"Weiter ▶")));

function drawCrew(cvs,looks){const x=cvs.getContext("2d");x.clearRect(0,0,cvs.width,cvs.height);x.save();x.scale(2,2);
  const n=looks.length,mid=(n-1)/2;
  looks.forEach((lk,i)=>{const o=i-mid;const order=Math.abs(o);});
  const ord=looks.map((lk,i)=>({lk,i,o:i===0?0:(i%2?-1:1)*Math.ceil(i/2)})).sort((a,b)=>Math.abs(b.o)-Math.abs(a.o));
  ord.forEach(({lk,o})=>{const sc=o===0?1.45:1.2-Math.abs(o)*.08;drawPerson(x,260+o*82,128-Math.abs(o)*6,lk,{scale:sc,face:o>0?-1:1});});
  x.restore();}
